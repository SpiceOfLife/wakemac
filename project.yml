name: WakeMac
options:
  bundleIdPrefix: app.oursblanc
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WakeMac:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.oursblanc.wakemac
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: WakeMac
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 同じネットワーク上のMacを探して起動するために使います。
        NSBonjourServices: ["_wakemac._tcp"]
  WakeMacAgent:
    type: application
    platform: macOS
    sources: [macOS, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.oursblanc.wakemac.agent
        PRODUCT_NAME: WakeMac Agent
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: WakeMac Agent
        LSUIElement: true
        NSLocalNetworkUsageDescription: iPhoneからこのMacを見つけて起動できるようにするために使います。
        NSBonjourServices: ["_wakemac._tcp"]
