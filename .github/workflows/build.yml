name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build iOS app (unsigned, compile check)
        run: |
          set -o pipefail
          xcodebuild -project WakeMac.xcodeproj -scheme WakeMac \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build | tee build/ios.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          grep -q "BUILD SUCCEEDED" build/ios.log

      - name: Build Mac agent (Release, ad-hoc signed)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project WakeMac.xcodeproj -scheme WakeMacAgent \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath build/mac \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build | tee build/mac.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build/mac.log

      - name: Package Mac agent
        run: |
          APP="build/mac/Build/Products/Release/WakeMac Agent.app"
          codesign --verify --deep --strict "$APP"
          lipo -info "$APP/Contents/MacOS/WakeMac Agent"
          ditto -c -k --sequesterRsrc --keepParent "$APP" WakeMac-Agent-macOS.zip
          shasum -a 256 WakeMac-Agent-macOS.zip | tee WakeMac-Agent-macOS.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WakeMac-Agent-macOS
          path: |
            WakeMac-Agent-macOS.zip
            WakeMac-Agent-macOS.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" WakeMac-Agent-macOS.zip WakeMac-Agent-macOS.zip.sha256 \
            --title "WakeMac $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
