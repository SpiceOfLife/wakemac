name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          mkdir -p build

      - name: Build iOS app (unsigned, compile check)
        run: |
          set -o pipefail
          xcodebuild -project WakeMac.xcodeproj -scheme WakeMac \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build > build/ios.log 2>&1 || true
          grep -E "error:|BUILD" build/ios.log | tail -40 || true
          grep -E "^/.*: error: " build/ios.log | sort -u | sed -E 's#^(/[^:]+):([0-9]+):([0-9]+): error: (.*)#::error file=\1,line=\2,col=\3::\4#' || true
          grep -E "error:" build/ios.log | grep -vE "^/" | sort -u | head -10 | sed 's/^/::error::ios: /' || true
          grep -q "BUILD SUCCEEDED" build/ios.log

      - name: Build Mac agent (Release, ad-hoc signed)
        if: always()
        run: |
          set -o pipefail
          xcodebuild -project WakeMac.xcodeproj -scheme WakeMacAgent \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath build/mac \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build > build/mac.log 2>&1 || true
          grep -E "error:|BUILD" build/mac.log | tail -40 || true
          grep -E "^/.*: error: " build/mac.log | sort -u | sed -E 's#^(/[^:]+):([0-9]+):([0-9]+): error: (.*)#::error file=\1,line=\2,col=\3::\4#' || true
          grep -E "error:" build/mac.log | grep -vE "^/" | sort -u | head -10 | sed 's/^/::error::mac: /' || true
          grep -q "BUILD SUCCEEDED" build/mac.log

      - name: Package Mac agent
        run: |
          APP="build/mac/Build/Products/Release/WakeMac Agent.app"
          codesign --verify --deep --strict "$APP"
          lipo -info "$APP/Contents/MacOS/WakeMac Agent"
          ditto -c -k --sequesterRsrc --keepParent "$APP" WakeMac-Agent-macOS.zip
          shasum -a 256 WakeMac-Agent-macOS.zip | tee WakeMac-Agent-macOS.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WakeMac-Agent-macOS
          path: |
            WakeMac-Agent-macOS.zip
            WakeMac-Agent-macOS.zip.sha256

      # main で VERSION の版がまだリリースされていなければ、タグを作って公開する
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          if gh release view "$V" >/dev/null 2>&1; then echo "$V is already released"; exit 0; fi
          gh release create "$V" WakeMac-Agent-macOS.zip WakeMac-Agent-macOS.zip.sha256 \
            --target "$GITHUB_SHA" --title "WakeMac $V" --notes-file RELEASE_NOTES.md
